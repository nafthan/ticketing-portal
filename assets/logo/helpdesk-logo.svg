<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 112" role="img" aria-label="helpdesk">
  <style>
    :root{--ink:#2A1820;--limb:#2A1820;--body:#FF8FAB;--screen:#2A1820;--glow:#FFC857;--cheek:#FF8FAB;--word:#2A1820;--dot:#C2255C}
    @media (prefers-color-scheme:dark){:root{--ink:#1E1512;--limb:#FBEBDD;--body:#FFC857;--screen:#1E1512;--glow:#FF8FAB;--cheek:#FF8FAB;--word:#FBEBDD;--dot:#FF8FAB}}
    .k{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:none;stroke:var(--glow);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .word{font:700 76px 'Bricolage Grotesque',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif;letter-spacing:-2px;fill:var(--word)}
  </style>
  <g transform="translate(0 3)">
    <path d="M60 84v7" fill="none" class="k" style="stroke:var(--limb)"/>
    <path d="M47 91h26l4 8H43z" fill="var(--body)" class="k"/>
    <rect x="16" y="12" width="88" height="72" rx="16" fill="var(--body)" class="k"/>
    <path d="M24 30q2-8 11-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="25" y="21" width="70" height="52" rx="9" fill="var(--screen)" stroke="var(--ink)" stroke-width="2.5"/>
    <ellipse cx="34" cy="51" rx="4" ry="2.5" fill="var(--cheek)" opacity=".7"/>
    <ellipse cx="86" cy="51" rx="4" ry="2.5" fill="var(--cheek)" opacity=".7"/>
    <g fill="var(--glow)"><rect x="42" y="38" width="9" height="11" rx="3"/><rect x="69" y="38" width="9" height="11" rx="3"/></g>
    <path d="M53 54q7 6 14 0" class="g"/>
    <path d="M32 61l4 3-4 3" class="g" style="stroke-width:2" opacity=".85"/>
    <path d="M40 67h6" class="g" style="stroke-width:2"/>
    <circle cx="93" cy="78" r="2.4" fill="#3DDC84" stroke="var(--ink)" stroke-width="1.4"/>
  </g>
  <text x="128" y="80" class="word">helpdesk<tspan fill="var(--dot)">.</tspan></text>
</svg>
