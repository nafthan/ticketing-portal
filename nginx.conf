# nginx config for serving helpdesk. Put TLS (HTTPS) in front of this, for
# example at your load balancer or reverse proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is one page; send unknown paths to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve the example adapter in production.
    location = /platform.example.js { return 404; }

    # Always fetch the latest page so updates show straight away.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Your API and stored images. Point these at your backend.
    # location /api/   { proxy_pass http://backend:3000; }
    # location /_blob/ { proxy_pass http://backend:3000; }

    include /etc/nginx/conf.d/security-headers.inc;
}
